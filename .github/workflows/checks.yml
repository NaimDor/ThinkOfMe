name: Generated files

on:
  pull_request:
  push:

jobs:
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Design tokens are up to date and pass contrast checks
        run: node design/generate-tokens.mjs --check
      - name: iOS strings match the Android source strings
        run: python3 scripts/sync-strings.py --check
