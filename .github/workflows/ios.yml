name: iOS

on:
  pull_request:
    paths: ["ios/**", "design/**", "scripts/sync-strings.py", ".github/workflows/ios.yml"]
  push:
    paths: ["ios/**", "design/**", "scripts/sync-strings.py", ".github/workflows/ios.yml"]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS minutes are free while the repository is public.
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Core package tests
        run: swift test --package-path Packages/Core
      - name: Firebase config (optional)
        env:
          GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST_B64" ]; then echo "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 -d > App/GoogleService-Info.plist; fi
      - name: Generate Xcode project
        run: xcodegen
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project ThinkOfMe.xcodeproj -scheme ThinkOfMe \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build | tee build.log | grep -E "error:|warning: .*ThinkOfMe|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Design system tests
        run: scripts/test-package.sh Packages/DesignSystem DesignSystem
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios/build.log
