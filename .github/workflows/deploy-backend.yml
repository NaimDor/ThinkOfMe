name: Deploy backend

# Deploys Firestore rules + indexes, Storage rules, Cloud Functions and the
# Hosting site (invite pages, privacy/terms/support, app-link files).
# Start it from GitHub → Actions → Deploy backend → "Run workflow".
#
# Secrets:
#   FIREBASE_PROJECT_ID            e.g. thinkofme-12345
#   FIREBASE_SERVICE_ACCOUNT_JSON  JSON key of the deploy service account
#   APPLE_TEAM_ID                  (shared with TestFlight) lets invite links open the iOS app
#   ANDROID_CERT_SHA256            optional; release signing certificate SHA-256, comma-separated
# Variables (Settings → Secrets and variables → Actions → Variables):
#   FIREBASE_HOSTING_SITE          optional; Hosting site ID, e.g. thinkofme (default: the project's site)
#   SUPPORT_EMAIL                  contact address shown on the privacy, terms and support pages

on:
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm ci --prefix functions
      - name: Test before deploying
        run: npm test --prefix functions && npm run test:rules --prefix functions

      - name: Prepare Hosting (app-link files, contact email, site)
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ANDROID_SHA: ${{ secrets.ANDROID_CERT_SHA256 }}
          SITE: ${{ vars.FIREBASE_HOSTING_SITE }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
        run: |
          mkdir -p hosting/public/.well-known
          if [ -n "$TEAM" ]; then
            cat > hosting/public/.well-known/apple-app-site-association <<EOF
          {"applinks":{"details":[{"appIDs":["$TEAM.com.thinkofme.app"],"components":[{"/":"/i/*","comment":"Circle invites"}]}]},"webcredentials":{"apps":["$TEAM.com.thinkofme.app"]}}
          EOF
          else
            echo "::warning::APPLE_TEAM_ID not set: invite links won't open the iOS app directly."
          fi
          fingerprints=$(printf '%s' "$ANDROID_SHA" | tr ',' '\n' | sed '/^\s*$/d; s/^\s*//; s/\s*$//; s/.*/"&"/' | paste -sd, -)
          cat > hosting/public/.well-known/assetlinks.json <<EOF
          [{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"com.thinkofme.app","sha256_cert_fingerprints":[${fingerprints}]}}]
          EOF
          if [ -n "$SUPPORT_EMAIL" ]; then
            grep -rl "__SUPPORT_EMAIL__" hosting/public | xargs sed -i "s/__SUPPORT_EMAIL__/${SUPPORT_EMAIL}/g"
          else
            echo "::warning::SUPPORT_EMAIL variable not set: pages show a placeholder contact address."
          fi
          if [ -n "$SITE" ]; then
            jq --arg site "$SITE" '.hosting.site = $site' firebase.json > firebase.tmp && mv firebase.tmp firebase.json
          fi

      - name: Store the photo-reading AI key in Secret Manager
        env:
          PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # The analyzePhoto function reads ANTHROPIC_API_KEY from Secret Manager. Without the
          # GitHub secret a placeholder is stored, so deploys work and the feature stays off.
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          value="${ANTHROPIC_API_KEY:-not-configured}"
          # Secret Manager is off in a new project; switching it on takes a minute to reach all of Google.
          gcloud services enable secretmanager.googleapis.com --project "$PROJECT" --quiet
          for attempt in 1 2 3 4 5 6 7 8; do
            if gcloud secrets describe ANTHROPIC_API_KEY --project "$PROJECT" --format=none 2>/dev/null; then break; fi
            if gcloud secrets create ANTHROPIC_API_KEY --project "$PROJECT" --replication-policy=automatic --quiet --format=none 2>/tmp/err; then break; fi
            if [ "$attempt" = 8 ]; then cat /tmp/err; exit 1; fi
            echo "Secret Manager not ready yet, retrying in 15s…"; sleep 15
          done
          current=$(gcloud secrets versions access latest --secret ANTHROPIC_API_KEY --project "$PROJECT" 2>/dev/null || true)
          if [ "$current" != "$value" ]; then
            printf '%s' "$value" | gcloud secrets versions add ANTHROPIC_API_KEY --project "$PROJECT" --data-file=- --quiet --format=none
            echo "AI key updated."
          else
            echo "AI key unchanged."
          fi
          [ -n "$ANTHROPIC_API_KEY" ] || echo "::warning::No ANTHROPIC_API_KEY secret: reading wish details from photos is off."

      - name: Deploy
        env:
          PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PROJECT" ] || [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::Add FIREBASE_PROJECT_ID and FIREBASE_SERVICE_ACCOUNT_JSON repository secrets."; exit 1
          fi
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          functions/node_modules/.bin/firebase deploy --project "$PROJECT" \
            --only firestore,storage,functions,hosting --force --non-interactive

      - name: Let the apps call the callable functions
        env:
          PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          # Callables check Firebase Auth inside the function; Cloud Run must still let the
          # request through. firebase deploy only sets this when it creates a function, so
          # apply it on every deploy.
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          for fn in createinvite previewinvite redeeminvite leavecircle removemember unfurllink deleteaccount analyzephoto; do
            gcloud run services add-iam-policy-binding "$fn" --region europe-west1 --project "$PROJECT" \
              --member=allUsers --role=roles/run.invoker --quiet --format=none
            echo "$fn: public invoker set"
          done
