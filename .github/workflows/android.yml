name: Android

on:
  pull_request:
    paths: ["android/**", "design/**", ".github/workflows/android.yml"]
  push:
    paths: ["android/**", "design/**", ".github/workflows/android.yml"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android platform
        run: |
          # The runner image ships the Android SDK; add the platform this project compiles against.
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v5
      - name: Firebase config (optional)
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json; fi
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Unit tests
        run: ./gradlew testDebugUnitTest -x :app:testDebugUnitTest
      - name: Screenshot tests (renders every main screen)
        run: ./gradlew :app:recordRoborazziDebug
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: thinkofme-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-screenshots
          path: android/app/build/outputs/roborazzi/
