name: Android

on:
  pull_request:
    paths: ["android/**", "design/**", ".github/workflows/android.yml"]
  push:
    paths: ["android/**", "design/**", ".github/workflows/android.yml"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Firebase config (optional)
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json; fi
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Unit and screenshot tests
        run: ./gradlew :app:recordRoborazziDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: thinkofme-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: android/app/build/outputs/roborazzi/
