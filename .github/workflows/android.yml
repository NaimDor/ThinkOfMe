name: Android

on:
  pull_request:
    paths: ["android/**", "design/**", ".github/workflows/android.yml", ".github/scripts/launch-test.sh"]
  push:
    paths: ["android/**", "design/**", ".github/workflows/android.yml", ".github/scripts/launch-test.sh"]

concurrency:
  group: android-${{ github.ref }}
  # Queue instead of cancelling, so a running emulator launch test always finishes.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android platform
        run: |
          # The runner image ships the Android SDK; add the platform this project compiles against.
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v5
      - name: Firebase config (optional)
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 || secrets.GOOGLE_SERVICE_JSON_B64 }}
        run: |
          FIREBASE="$GOOGLE_SERVICES_JSON_B64"
          [ -z "$FIREBASE" ] && exit 0
          # Accept either the plain google-services.json contents or base64 of the file.
          if printf '%s' "$FIREBASE" | head -c 20 | grep -q '{'; then
            printf '%s\n' "$FIREBASE" > app/google-services.json
          else
            printf '%s' "$FIREBASE" | base64 -d > app/google-services.json
          fi
          python3 -c "import json; c=json.load(open('app/google-services.json')); assert any(x['client_info']['android_client_info']['package_name']=='com.thinkofme.app' for x in c['client']), 'google-services.json has no com.thinkofme.app app'"
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Build release bundle (shrunk with R8, unsigned)
        # Same build as the Play release, without the signing key: catches R8 / keep-rule problems early.
        run: ./gradlew :app:bundleRelease --stacktrace
      - name: Unit tests
        run: ./gradlew testDebugUnitTest -x :app:testDebugUnitTest
      - name: Screenshot tests (renders every main screen)
        run: ./gradlew :app:recordRoborazziDebug
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: thinkofme-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-screenshots
          path: android/app/build/outputs/roborazzi/

  launch-test:
    # Starts the shrunk (R8) release build on an emulator and fails if it crashes at launch.
    # Catches what compiling can't: classes R8 removed or renamed that are only created at runtime.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android platform
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v5
      - name: Firebase config (optional)
        working-directory: android
        env:
          FIREBASE: ${{ secrets.GOOGLE_SERVICES_JSON_B64 || secrets.GOOGLE_SERVICE_JSON_B64 }}
        run: |
          [ -z "$FIREBASE" ] && exit 0
          if printf '%s' "$FIREBASE" | head -c 20 | grep -q '{'; then
            printf '%s\n' "$FIREBASE" > app/google-services.json
          else
            printf '%s' "$FIREBASE" | base64 -d > app/google-services.json
          fi
      - name: Build release APK (shrunk, debug-signed)
        working-directory: android
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Launch on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/launch-test.sh android/app/build/outputs/apk/release/app-release.apk
      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: launch-test-logcat
          path: launch-logcat.txt
          if-no-files-found: ignore
