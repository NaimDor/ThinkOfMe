name: App Store listing

# Captures the store screenshots from the iOS app (demo data, every language), frames them,
# and pushes them with the listing text in store/app-store to App Store Connect.
# Also draws the product page header and search results art and places it on the version.
# It never submits for review. Download "app-store-screenshots" / "app-store-creative-assets" to look at the images.
on:
  workflow_dispatch:
    inputs:
      screenshots:
        description: Capture and upload new screenshots
        type: boolean
        default: true
      upload:
        description: Push to App Store Connect (off = only build the screenshots to review)
        type: boolean
        default: true
      build:
        description: Build number to attach (empty = newest processed build of this version)
        default: ""
      creative:
        description: Draw and place the header and search results art (store/app-store/creative)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  capture:
    if: ${{ inputs.screenshots }}
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen
      - name: Boot the largest iPhone with a clean status bar
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [d | {"runtime": r} for r, ds in json.load(sys.stdin)["devices"].items() if "iOS" in r for d in ds]
          pro_max = [d for d in devices if "Pro Max" in d["name"]] or [d for d in devices if "Plus" in d["name"]]
          pro_max.sort(key=lambda d: (d["runtime"], d["name"]))
          print(pro_max[-1]["udid"])')
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          xcrun simctl list devices | grep "$udid"
      - name: Capture screenshots
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/raw"
          TEST_RUNNER_SCREENSHOT_DIR="$RUNNER_TEMP/raw" xcodebuild test -project ThinkOfMe.xcodeproj -scheme ThinkOfMe \
            -destination "id=$UDID" -only-testing:ThinkOfMeUITests/StoreScreenshotTests \
            -skipPackagePluginValidation -skipMacroValidation CODE_SIGNING_ALLOWED=NO | tee test.log | grep -E "error:|Test Case|TEST" || true
          count=$(find "$RUNNER_TEMP/raw" -name '*.png' | wc -l | tr -d ' ')
          echo "Captured $count screenshots"
          [ "$count" -gt 0 ]
      - uses: actions/upload-artifact@v5
        with:
          name: raw-screenshots
          path: ${{ runner.temp }}/raw
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: screenshot-test-log
          path: ios/test.log

  compose:
    needs: capture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: raw-screenshots
          path: raw
      - name: Frame the screenshots
        run: |
          pip install --quiet "pillow==12.0.0"
          python3 -c "from PIL import features; assert features.check('raqm'), 'Pillow needs raqm for Hebrew and Arabic'"
          python3 store/app-store/compose.py raw app-store-screenshots
      - uses: actions/upload-artifact@v5
        with:
          name: app-store-screenshots
          path: app-store-screenshots

  upload:
    needs: compose
    if: ${{ always() && inputs.upload && (needs.compose.result == 'success' || needs.compose.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        if: ${{ inputs.screenshots }}
        with:
          name: app-store-screenshots
          path: app-store-screenshots
      - name: Push listing to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          REVIEW_CONTACT: ${{ secrets.TESTFLIGHT_REVIEW_CONTACT }}
          COPYRIGHT: ${{ vars.APP_COPYRIGHT }}
          BUNDLE_ID: com.thinkofme.app
          VERSION: "1.0"
          BUILD_NUMBER: ${{ inputs.build }}
        run: |
          pip install --quiet "pyjwt[crypto]==2.10.1" "requests==2.32.5"
          python3 scripts/app_store_listing.py app-store-screenshots

  creative:
    # After the listing job, so the version and its languages exist.
    needs: upload
    if: ${{ always() && inputs.creative && (needs.upload.result == 'success' || needs.upload.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install renderer
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          pip install --quiet "pillow==12.0.0" "pyjwt[crypto]==2.10.1" "requests==2.32.5"
      - name: Render header and search results art
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node store/app-store/creative/render.js
      - uses: actions/upload-artifact@v5
        with:
          name: app-store-creative-assets
          path: store/app-store/creative/out/*.png
      - name: Upload and place in App Store Connect
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          BUNDLE_ID: com.thinkofme.app
          VERSION: "1.0"
        run: python3 scripts/app_store_creative.py store/app-store/creative/out
