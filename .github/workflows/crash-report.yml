name: Crash report

# Summarises Crashlytics crashes from the BigQuery export (Firebase → Project settings →
# Integrations → BigQuery → Crashlytics), per app version, with the top stack of each issue.
# The result is in the run's summary and log. Setup: docs/ANALYTICS.md "Crash reports".
on:
  workflow_dispatch:
    inputs:
      days:
        description: How many days back
        default: "7"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Crashes per issue and version
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          DAYS: ${{ inputs.days }}
        run: |
          pip install --quiet "google-cloud-bigquery==3.47.0"
          python3 scripts/crash_report.py
